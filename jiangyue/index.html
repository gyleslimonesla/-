<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14130f">
<title>江月何年</title>
<!--STYLE-->
<style>
:root{--parch:#F4EDDB;--gold:#D9C29A;--goldD:#A98E5C;--ink:#36352B;--bg:#14130f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:"Cormorant Garamond","Noto Serif SC","Songti SC",serif;color:var(--parch);-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);height:100vh;height:100dvh}
#frame{position:relative;overflow:hidden;background:#0d0c09;box-shadow:0 0 80px rgba(0,0,0,.6);--u:4px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame.playing:not(.ui){cursor:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* loading */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);background:#14130f;transition:opacity .9s ease;z-index:5}
#frame.ready #loading{opacity:0;pointer-events:none}
#loadText{font-size:calc(var(--u)*3.4);letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
#barBox{width:calc(var(--u)*30);height:1px;background:rgba(217,194,154,.22)}
#bar{height:100%;background:var(--gold);transform-origin:left;transform:scaleX(.05);transition:transform .5s ease}
/* start */
#startLayer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--u)*9);z-index:4;opacity:0;pointer-events:none;transition:opacity 1s ease}
#frame.ready:not(.started) #startLayer{opacity:1;pointer-events:auto}
#startLayer::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(244,237,219,.96) 30%,rgba(244,237,219,0))}
#start{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.6);color:var(--ink)}
#start .ring{width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:50%;border:1.5px solid var(--goldD);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .4s ease,background .4s ease}
#start .ring::after{content:"";position:absolute;inset:calc(var(--u)*-1.4);border-radius:50%;border:1px solid rgba(169,142,92,.45);animation:breathe 3.2s ease-in-out infinite}
#start:hover .ring,#start:active .ring{transform:scale(1.05);background:rgba(217,194,154,.22)}
#start svg{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);margin-left:calc(var(--u)*.7);fill:var(--ink)}
#startText{font-size:calc(var(--u)*4);letter-spacing:.5em;padding-left:.5em;font-weight:600}
#hint{position:relative;margin-top:calc(var(--u)*2.4);font-size:calc(var(--u)*2.5);letter-spacing:.24em;color:#7a6a45}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.35}}
.qrow{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*3);font-size:calc(var(--u)*2.5);color:#7a6a45;letter-spacing:.2em}
.qrow button{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:50%;border:1px solid rgba(169,142,92,.5);color:#6b5c3a;letter-spacing:0}
.qrow button.on{background:var(--ink);border-color:var(--ink);color:var(--parch)}
/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*10) calc(var(--u)*5) calc(var(--u)*4.4);background:linear-gradient(to top,rgba(16,15,11,.82),rgba(16,15,11,0));z-index:3;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
#frame.started.ui #controls{opacity:1;transform:none;pointer-events:auto}
#track{position:relative;height:calc(var(--u)*5);cursor:pointer;touch-action:none}
#track .rail{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(244,237,219,.25)}
#fill{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--gold);transform-origin:left;transform:scaleX(0)}
#knob{position:absolute;top:50%;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);margin:calc(var(--u)*-1.1) 0 0 calc(var(--u)*-1.1);border-radius:50%;background:var(--parch);box-shadow:0 0 0 1px var(--goldD)}
#track i{position:absolute;top:50%;width:1px;height:calc(var(--u)*1.6);margin-top:calc(var(--u)*-.8);background:rgba(244,237,219,.55)}
.row{display:flex;align-items:center;gap:calc(var(--u)*3.2);margin-top:calc(var(--u)*1.6)}
.row svg{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);fill:none;stroke:var(--parch);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{width:calc(var(--u)*8);height:calc(var(--u)*8);display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib:active{background:rgba(244,237,219,.14)}
#pp .a{display:block}#pp .b{display:none}#frame.playing #pp .a{display:none}#frame.playing #pp .b{display:block}
#mute.off .w{display:none}#mute:not(.off) .x{display:none}
#time{font-size:calc(var(--u)*3);letter-spacing:.08em;font-variant-numeric:tabular-nums;min-width:calc(var(--u)*19)}
.sp{flex:1}
#vol{-webkit-appearance:none;appearance:none;width:calc(var(--u)*15);height:calc(var(--u)*6);background:none;margin:0}
#vol::-webkit-slider-runnable-track{height:2px;background:rgba(244,237,219,.4)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;background:var(--parch);margin-top:calc(var(--u)*-1.2 + 1px)}
#vol::-moz-range-track{height:2px;background:rgba(244,237,219,.4)}#vol::-moz-range-thumb{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border:0;border-radius:50%;background:var(--parch)}
.row2{display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.4);letter-spacing:.16em;color:rgba(244,237,219,.75)}
.row2 button[data-q]{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6);border-radius:50%;border:1px solid rgba(244,237,219,.35);letter-spacing:0}
.row2 button.on{background:var(--parch);color:var(--ink);border-color:var(--parch)}
.row2 label{cursor:pointer;border-bottom:1px solid rgba(244,237,219,.4);padding-bottom:1px}
#narrState{opacity:.7}
#narrFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#replayBox{position:absolute;left:0;right:0;top:0;bottom:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*30.5);z-index:4;pointer-events:none}
#frame.ended #replayBox{display:flex}
#replay{pointer-events:auto;display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.6) calc(var(--u)*4);border:1px solid var(--goldD);border-radius:calc(var(--u)*6);color:var(--ink);background:rgba(244,237,219,.78);font-size:calc(var(--u)*3);letter-spacing:.3em;font-weight:600;animation:fadein 1.6s ease 1.2s both}
#replay svg{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#toast{position:absolute;left:50%;top:calc(var(--u)*8);transform:translateX(-50%);padding:calc(var(--u)*1.4) calc(var(--u)*3.4);background:rgba(20,19,15,.78);border:1px solid rgba(217,194,154,.4);border-radius:calc(var(--u)*5);font-size:calc(var(--u)*2.6);letter-spacing:.2em;opacity:0;transition:opacity .5s;z-index:6;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#start .ring::after{animation:none}}
</style>
<!--/STYLE-->
</head>
<body>
<div id="wrap"><div id="frame" class="ui">
  <canvas id="stage" width="1080" height="1920" aria-label="《江月何年》180 秒短片"></canvas>
  <div id="replayBox"><button id="replay" type="button"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.6h4.6"/></svg><span id="replayText"></span></button></div>
  <div id="controls">
    <div id="track" role="slider" aria-label="进度" aria-valuemin="0" aria-valuemax="180">
      <div class="rail"></div><div id="fill"></div>
      <i style="left:8%"></i><i style="left:25.333%"></i><i style="left:44%"></i><i style="left:62.667%"></i><i style="left:79.333%"></i><i style="left:94.667%"></i>
      <div id="knob"></div>
    </div>
    <div class="row">
      <button class="ib" id="pp" type="button" aria-label="播放 / 暂停"><svg class="a" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#F4EDDB"/></svg><svg class="b" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="2.2"/></svg></button>
      <span id="time">0:00 / 3:00</span><span class="sp"></span>
      <button class="ib" id="mute" type="button" aria-label="静音"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
      <button class="ib" id="fs" type="button" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M5 9.5V5h4.5M19 9.5V5h-4.5M5 14.5V19h4.5M19 14.5V19h-4.5"/></svg></button>
    </div>
    <div class="row2">
      <span id="qLabel"></span><button data-q="0" type="button"></button><button data-q="1" type="button"></button><button data-q="2" type="button"></button>
      <span class="sp"></span><span id="narrState"></span><label for="narrFile" id="narrLabel"></label><input id="narrFile" type="file" accept="audio/*">
    </div>
  </div>
  <div id="startLayer">
    <button id="start" type="button"><span class="ring"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></span><span id="startText"></span></button>
    <div id="hint"></div>
    <div class="qrow"><button data-q="0" type="button"></button><button data-q="1" type="button"></button><button data-q="2" type="button"></button></div>
  </div>
  <div id="loading"><div id="loadText"></div><div id="barBox"><div id="bar"></div></div></div>
  <div id="toast"></div>
</div></div>
<!--SCRIPTS-->
<script src="src/script.js"></script>
<script src="src/core.js"></script>

<script src="src/a8-ba.js"></script>
<script src="src/film.js"></script>

<script src="src/player.js"></script>

</body>
</html>
