<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1130">
<title>夜是一只很大的猫</title>
<!--STYLE-->
<style>
:root{--night:#0B1130;--deep:#141C46;--ink:#11173A;--paper:#F3EBDA;--paperD:#E4D9C0;--cream:#F5E8CF;--gold:#F3C66C;--lamp:#F7A94C;--pale:#A6B5E6;--blue:#40559E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{font-family:"LXGW WenKai","Kaiti SC","STKaiti","Songti SC",serif;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#book{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;--pw:360px;--u:3.6px;
  background:radial-gradient(120% 90% at 50% 20%,#1B2756 0%,#0B1130 70%)}
#leaf{width:var(--pw);display:flex;flex-direction:column;background:var(--paper);box-shadow:0 calc(var(--u)*2) calc(var(--u)*10) rgba(0,0,0,.55);border-radius:calc(var(--u)*.8);overflow:hidden}
#plateBox{position:relative;width:var(--pw);height:calc(var(--pw)*1.5);background:var(--night)}
#plate{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#text{position:relative;height:max(184px,calc(var(--u)*47));overflow:hidden;padding:calc(var(--u)*3) calc(var(--u)*5.4) 0;background:linear-gradient(#F6EFDF,#EFE6D2);border-top:1px solid rgba(17,23,58,.18);transition:opacity .35s ease}
#book.turning #text{opacity:0}
#lines p{margin:0 0 calc(var(--u)*.9);font-size:clamp(14.5px,calc(var(--u)*4.1),20px);line-height:1.56;letter-spacing:.02em;text-wrap:pretty;opacity:0;animation:rise .9s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.2);padding-top:6px;background:linear-gradient(rgba(239,230,210,0),#EFE6D2 40%);text-align:center;font-size:max(12px,calc(var(--u)*3.1));color:#8A7A52;letter-spacing:.12em}
#hint:not(:empty)::before{content:"✦ ";color:var(--lamp)}
#nav{display:flex;align-items:center;justify-content:space-between;height:max(48px,calc(var(--u)*13));padding:0 calc(var(--u)*3);background:#EFE6D2;border-top:1px solid rgba(17,23,58,.1)}
#nav button{width:max(44px,calc(var(--u)*11));height:max(44px,calc(var(--u)*11));display:flex;align-items:center;justify-content:center;border-radius:50%}
#nav button:disabled{opacity:.22}
#nav button:active{background:rgba(17,23,58,.08)}
#nav svg{width:max(20px,calc(var(--u)*5));height:max(20px,calc(var(--u)*5));fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mid{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2)}
#dots{display:flex;gap:calc(var(--u)*1.5)}
#dots i{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:50%;background:rgba(17,23,58,.2);transition:background .4s,transform .4s}
#dots i.on{background:var(--lamp);transform:scale(1.5)}
#num{font-size:max(11px,calc(var(--u)*2.8));color:#8A7A52;letter-spacing:.1em;min-height:1em}
#snd.off .w{display:none}#snd:not(.off) .x{display:none}
/* cover */
#coverUI{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(var(--u)*17);color:var(--cream);text-align:center;pointer-events:none}
#book.cover #coverUI{display:flex}
#title{font-size:calc(var(--u)*11);letter-spacing:.16em;padding-left:.16em;line-height:1.34;text-shadow:0 2px 18px rgba(8,10,34,.95)}
#sub{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*3.3);letter-spacing:.24em;color:var(--pale);text-shadow:0 1px 10px rgba(8,10,34,.9)}
#open{pointer-events:auto;position:absolute;left:50%;bottom:calc(var(--u)*12);transform:translateX(-50%);display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2.6) calc(var(--u)*7);border-radius:calc(var(--u)*8);background:rgba(245,232,207,.94);color:var(--ink);font-size:calc(var(--u)*4.4);letter-spacing:.4em;padding-left:calc(var(--u)*8.6);box-shadow:0 0 0 1px rgba(243,198,108,.9),0 0 calc(var(--u)*8) rgba(247,169,76,.5);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(243,198,108,.9),0 0 calc(var(--u)*14) rgba(247,169,76,.75)}}
#book.cover #text,#book.cover #nav{display:none}
#book.cover #plateBox{height:calc(var(--pw)*1.5)}
#again{display:none;position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1.2);font-size:max(12px,calc(var(--u)*3.1));letter-spacing:.2em;color:#8A7A52;border-bottom:1px solid rgba(138,122,82,.5)}
#book.last #again{display:block}#book.last #hint{text-align:left;padding-left:calc(var(--u)*6)}
/* loading */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--night);color:var(--pale);font-size:16px;letter-spacing:.5em;transition:opacity .8s;z-index:5}
#book.ready #loading{opacity:0;pointer-events:none}
#barBox{width:140px;height:1px;background:rgba(166,181,230,.25)}#bar{height:100%;background:var(--gold);transform-origin:left;transform:scaleX(.04);transition:transform .4s}
/* wide screens: plate left, words right */
#book.wide #leaf{flex-direction:row;width:auto;align-items:stretch}
#book.wide #side{display:flex;flex-direction:column;width:min(380px,34vw)}
#book.wide #text{flex:1;height:auto;padding:calc(var(--u)*8) calc(var(--u)*7) 0;border-top:0;border-left:1px solid rgba(17,23,58,.18)}
#book.wide #nav{border-left:1px solid rgba(17,23,58,.18)}
#book.wide #lines p{font-size:19px;margin-bottom:.7em}
#book.wide.cover #side{display:none}
#side{display:contents}
#book.wide #side{display:flex}
@media (prefers-reduced-motion:reduce){#open{animation:none}#lines p{animation-duration:.01s}}
</style>
<!--/STYLE-->
</head>
<body>
<div id="book" class="cover">
  <div id="leaf">
    <div id="plateBox">
      <canvas id="plate" width="1080" height="1620" aria-label="插画"></canvas>
      <div id="coverUI"><div id="title"></div><div id="sub"></div><button id="open" type="button"><span id="openT"></span></button></div>
    </div>
    <div id="side">
      <div id="text"><div id="lines"></div><div id="hint"></div><button id="again" type="button"><span id="againT"></span></button></div>
      <div id="nav">
        <button id="prev" type="button" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <div id="mid"><div id="dots"></div><div id="num"></div></div>
        <button id="snd" type="button" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
        <button id="next" type="button" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </div>
    </div>
  </div>
  <div id="loading"><div id="loadT"></div><div id="barBox"><div id="bar"></div></div></div>
</div>
<!--SCRIPTS-->
<script src="src/story.js"></script>
<script src="src/core.js"></script>
<script src="src/paint.js"></script>
<script src="src/ink.js"></script>
<script src="src/plates1.js"></script>
<script src="src/plates2.js"></script>
<script src="src/book.js"></script>
<!--/SCRIPTS-->
</body>
</html>
